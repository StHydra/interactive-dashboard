    <h1>My Interactive Dashboard</h1>

```
<p>This dashboard was created by Ayden Marks for the WEB-115 course at Wake Tech.</p>

<script>
    document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
</script>

<!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
<noscript>
    Unfortunately, your web browser does not support JavaScript.
</noscript>

<div class="container">
    <div class="row">

        <div class="col" id="weekly-tasks">

            <script src="task-manager.js"></script>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <label for="daily-goal">Daily Task Goal:</label>
                <input type="number" id="daily-goal" name="daily-goal">

                <label for="weekly-bonus">Weekly Bonus Tasks:</label>
                <input type="number" id="weekly-bonus" name="weekly-bonus">

                <button type="button" id="goal-btn">Set Goal</button>
            </form>

            <p id="goal-message"></p>

        </div>

        <div class="col" id="metric-converter">

            <h2>Metric Converter</h2>

            <form id="converter-form">

                <label for="conversion-value">Value:</label>
                <input type="number" id="conversion-value" name="conversion-value" step="any">

                <label for="conversion-type">Conversion:</label>
                <select id="conversion-type" name="conversion-type">
                    <option value="inch-to-cm">Inches to Centimeters</option>
                    <option value="foot-to-cm">Feet to Centimeters</option>
                    <option value="yard-to-m">Yards to Meters</option>
                    <option value="mile-to-km">Miles to Kilometers</option>
                    <option value="cm-to-inch">Centimeters to Inches</option>
                    <option value="cm-to-foot">Centimeters to Feet</option>
                    <option value="m-to-yard">Meters to Yards</option>
                    <option value="km-to-mile">Kilometers to Miles</option>
                </select>

                <button type="button" id="convert-btn">Convert</button>

            </form>

            <p id="conversion-result"></p>

            <script defer src="metric-converter.js"></script>

        </div>

    </div>
</div>
